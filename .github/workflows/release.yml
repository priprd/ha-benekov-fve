name: Release

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

jobs:
  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify tag matches manifest.json version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME}"
          MANIFEST_VERSION=$(python3 -c "import json; print(json.load(open('custom_components/benekov_fve/manifest.json'))['version'])")
          echo "Tag version:      $TAG_VERSION"
          echo "Manifest version: $MANIFEST_VERSION"
          if [ "$TAG_VERSION" != "$MANIFEST_VERSION" ]; then
            echo "::error::Tag $TAG_VERSION does not match manifest.json version $MANIFEST_VERSION"
            exit 1
          fi

      - name: Extract changelog section for this tag
        id: changelog
        run: |
          TAG="${GITHUB_REF_NAME}"
          # Extract lines from "## [TAG]" up to (but not including) the next "## [" heading.
          awk -v tag="$TAG" '
            BEGIN { flag = 0 }
            /^## \[/ {
              if (flag == 1) { exit }
              if ($0 ~ "^## \\[" tag "\\]") { flag = 1; next }
            }
            flag == 1 { print }
          ' CHANGELOG.md > release_body.md
          if [ -s release_body.md ]; then
            echo "Found CHANGELOG.md section for ${TAG}:"
            echo "----------------------------------------"
            cat release_body.md
            echo "----------------------------------------"
            echo "fallback=false" >> "$GITHUB_OUTPUT"
          else
            echo "No CHANGELOG.md section found for ${TAG}; will fall back to auto-generated notes."
            echo "fallback=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Package integration as zip
        run: |
          cd custom_components/benekov_fve
          zip -r "${GITHUB_WORKSPACE}/benekov_fve.zip" . -x "__pycache__/*" "*.pyc"
          ls -lh "${GITHUB_WORKSPACE}/benekov_fve.zip"

      - name: Create GitHub Release (with changelog body)
        if: steps.changelog.outputs.fallback == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body_path: release_body.md
          files: benekov_fve.zip
          fail_on_unmatched_files: true

      - name: Create GitHub Release (fallback, auto-generated notes)
        if: steps.changelog.outputs.fallback == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: benekov_fve.zip
          fail_on_unmatched_files: true
