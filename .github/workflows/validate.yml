name: Validate

on:
  push:
  pull_request:
  schedule:
    # Run daily so we catch any breaking changes in HACS / hassfest specs.
    - cron: "0 0 * * *"

jobs:
  hacs:
    name: HACS Action
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: HACS validation
        uses: hacs/action@main
        with:
          category: integration
          # Skip the brand asset check until icon/logo is published in
          # home-assistant/brands. Remove this once that PR is merged.
          ignore: brands

  hassfest:
    name: Hassfest
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Hassfest validation
        uses: home-assistant/actions/hassfest@master
